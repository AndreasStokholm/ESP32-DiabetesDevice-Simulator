; ESP-Sim + G7: an Omnipod pod and Dexcom G6/G7 sensor simulator on one ESP32-S3.
; Test equipment only: no insulin, made-up data. GPL-3.0-or-later.
;
; The two portable cores are in lib/ (PlatformIO links them like any other
; library): lib/dashpod is the pod, lib/cgmsim is the CGM (a Dexcom G6
; transmitter or a G7 sensor), both verbatim from github.com/nightscout/ESP-Sim.
; The Medtrum patch's core is lib/medtrumpatch. src/sensor_app.cpp wires the CGM
; core to the radio, flash and clock; it is the only CGM engine on the board.
; The Bluetooth 5 extended advertiser: see CONFIG_BT_NIMBLE_EXT_ADV below.

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
; The g7sim port (src/sensor.cpp, handler.cpp, crypto.cpp and their headers) is
; retired: nothing in the firmware starts it, so it is kept for reference but
; left out of the build (no flash cost, no accidental include). Delete the six
; files when the history is not wanted.
build_src_filter = +<*> -<sensor.cpp> -<handler.cpp> -<crypto.cpp>
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
; The board flashes over the ESP32-S3's NATIVE USB (ARDUINO_USB_MODE=1), where the
; stub's baud change to 460800 can stall -- esptool then reports "No serial data
; received" right after "Changing baud rate". 115200 costs ~2 minutes an upload
; and connects every time. Raise it per machine if your cable is happy with more.
upload_speed = 115200
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = direct
lib_deps =
  h2zero/NimBLE-Arduino@1.4.3
  bblanchon/ArduinoJson@7.2.1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
  ; Two advertising sets, as ESP-Sim's main/ble.c has them: instance 0 is the
  ; pump set (the pod, or the Medtrum base when the selector in src/main.cpp
  ; says Medtrum; never both) and instance 1 is the CGM's (G6 or G7). The two
  ; sets advertise at the same time, so a phone sees the selected pump and the
  ; CGM at once. Each keeps its own payload byte-exact (the pod's and the
  ; patch's service lists, the CGM's 0xFEBC advert), so they cannot be merged.
  -DCONFIG_BT_NIMBLE_EXT_ADV=1
  -DCONFIG_BT_NIMBLE_MAX_EXT_ADV_INSTANCES=2
  -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -std=gnu++17
build_unflags = -std=gnu++11
