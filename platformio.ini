; ESP-Sim + G7: an Omnipod pod and Dexcom G6/G7 sensor simulator on one ESP32-S3.
; Test equipment only: no insulin, made-up data. GPL-3.0-or-later.
;
; The two portable cores are in lib/ (PlatformIO links them like any other
; library): lib/dashpod is the pod, lib/cgmsim is the CGM (a Dexcom G6
; transmitter or a G7 sensor), both verbatim from github.com/nightscout/ESP-Sim.
; The Medtrum patch's core is lib/medtrumpatch. src/sensor_app.cpp wires the CGM
; core to the radio, flash and clock; it is the only CGM engine on the board.
; The Bluetooth 5 extended advertiser: see CONFIG_BT_NIMBLE_EXT_ADV below.

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = direct
lib_deps =
  h2zero/NimBLE-Arduino@1.4.3
  bblanchon/ArduinoJson@7.2.1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
  ; One advertising set, shared by the pod, the CGM (G6 or G7) and the Medtrum
  ; patch: src/adv_rotation.h hands it to whichever of them needs to be found,
  ; 1500 ms at a time. Each keeps its own payload byte-exact (the pod's and the
  ; patch's service lists, the CGM's 0xFEBC advert), so they cannot be merged.
  -DCONFIG_BT_NIMBLE_EXT_ADV=1
  -DCONFIG_BT_NIMBLE_MAX_EXT_ADV_INSTANCES=1
  -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -std=gnu++17
build_unflags = -std=gnu++11
