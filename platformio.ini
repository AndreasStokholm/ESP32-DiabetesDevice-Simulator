; ESP-Sim + G7: an Omnipod pod and Dexcom G7 sensor simulator on one ESP32-S3.
; Test equipment only: no insulin, made-up data. GPL-3.0-or-later.

[env:esp32s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = direct
lib_deps =
  h2zero/NimBLE-Arduino@1.4.3
  bblanchon/ArduinoJson@7.2.1
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
  ; One advertising set shared by the pod, the G7 and the Medtrum patch.
  -DCONFIG_BT_NIMBLE_EXT_ADV=1
  -DCONFIG_BT_NIMBLE_MAX_EXT_ADV_INSTANCES=1
  -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -std=gnu++17
build_unflags = -std=gnu++11
